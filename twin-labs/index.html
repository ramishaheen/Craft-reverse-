<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Twin Labs — Rover Lab &amp; Systems Lab</title>
  <meta name="description" content="Two hands-on labs in one place: build and drive a robot car in 3D, and break live simulations of the systems behind big websites.">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b82f6'/%3E%3Ccircle cx='11' cy='16' r='5' fill='none' stroke='%23fbbf24' stroke-width='2.6'/%3E%3Crect x='18' y='10' width='8' height='12' rx='2' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3C/svg%3E">
  <script>
    // Apply the saved theme before first paint.
    (function () {
      var t = 'dark';
      try { t = JSON.parse(localStorage.getItem('twinlabs:theme')) || 'dark'; } catch (e) {}
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
    })();
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
  <link rel="stylesheet" href="./css/theme.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="app-header">
    <a class="brand" href="#/" aria-label="Twin Labs home">
      <span class="brand-mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="8" cy="12" r="4.5"/><rect x="14" y="6" width="7" height="12" rx="2"/></svg>
      </span>
      <span class="name">Twin<b>Labs</b></span>
    </a>
    <nav class="lab-tabs" aria-label="Labs">
      <a class="lab-tab" data-lab="rover" href="#/rover">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="8" width="18" height="8" rx="2"/><circle cx="7" cy="18" r="2.4"/><circle cx="17" cy="18" r="2.4"/><path d="M12 8V4M9 4h6"/></svg>
        <span>Rover<span class="label-long"> Lab</span></span>
      </a>
      <a class="lab-tab" data-lab="systems" href="#/systems">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="8.5" y="14" width="7" height="7" rx="1.5"/><path d="M6.5 10v2h11v-2M12 12v2"/></svg>
        <span>Systems<span class="label-long"> Lab</span></span>
      </a>
    </nav>
    <div class="header-spacer"></div>
    <div class="header-slot" id="header-slot"></div>
    <div class="seg compact" id="theme-seg" role="group" aria-label="Theme">
      <button type="button" data-theme-choice="auto" title="Follow the system">Auto</button>
      <button type="button" data-theme-choice="light">Light</button>
      <button type="button" data-theme-choice="dark">Dark</button>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
  <noscript><p style="padding:24px">Twin Labs needs JavaScript to run its simulations.</p></noscript>
</body>
</html>
